name: anthropic_arena
description: A gamified, level-based learning app that teaches Anthropic Skill Jar course material as a game.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  google_fonts: ^6.2.1
  video_player: ^2.11.1
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.1
  confetti: ^0.8.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/content/
